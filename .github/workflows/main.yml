name: Build SportzX IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen 2.40.1
        run: |
          curl -sL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/2.40.1/xcodegen.zip"
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen" >> $GITHUB_PATH

      - name: Generate Xcode Project
        run: |
          rm -rf SportzX.xcodeproj
          /tmp/xcodegen/xcodegen generate --project .
          echo "=== Generated project.pbxproj ==="
          cat -v SportzX.xcodeproj/project.pbxproj

      - name: Build App
        run: |
          set -o pipefail
          xcodebuild -project "SportzX.xcodeproj" \
            -scheme "SportzX" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.sportzx.ios \
            clean build 2>&1 | head -100

      - name: Package IPA
        if: success()
        run: |
          mkdir -p ipa/Payload
          cp -r "build/Build/Products/Release-iphoneos/SportzX.app" "ipa/Payload/"
          cd ipa
          zip -r SportzX.ipa Payload/
          mv SportzX.ipa "${{ github.workspace }}/SportzX.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SportzX-ipa
          path: SportzX.ipa
          compression-level: 0
          retention-days: 7
